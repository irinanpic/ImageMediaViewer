[package]
name = "image-media-viewer"
default-run = "image-media-viewer"
version = "0.1.0"
description = "Lightweight cross-platform image catalog viewer"
authors = ["ImageMediaViewer Team"]
edition = "2021"

[[bin]]
name = "image-media-viewer"
path = "src/main.rs"

[[bin]]
name = "gen_thumbs"
path = "src/bin/gen_thumbs.rs"

[lib]
name = "image_media_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.3", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2.5"
rayon = "1.10"
exif = { package = "kamadak-exif", version = "0.6" }
imagesize = "0.13"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
fast_image_resize = "5"
webp = "0.3"
blake3 = "1.5"
chrono = { version = "0.4", features = ["serde"] }
notify = "7"
notify-debouncer-full = "0.4"
tokio = { version = "1", features = ["sync"] }
url = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
ts-rs = { version = "10", features = ["chrono-impl"] }
tiny_http = "0.12"
dirs = "7.0.0"

# デスクトップ専用（Windows, macOS, Linux）の依存関係
# モバイル環境（Android, iOS）では二重起動防止やデスクトップファイルマネージャー機能が非対応または不要なため分離
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# 選定理由: 二重起動を防止し、トレイ常駐時や起動中に再度アプリを実行した際、既存ウィンドウを最前面へ復元するため
tauri-plugin-single-instance = "2"
# 選定理由: デスクトップ環境のエクスプローラー等で該当ファイルを選択状態（ハイライト）で開くため
opener = { version = "0.7", features = ["reveal"] }

[dev-dependencies]
tempfile = "3"
