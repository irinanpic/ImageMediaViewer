[package]
name = "image-media-viewer"
version = "0.1.0"
description = "Lightweight cross-platform image catalog viewer"
authors = ["ImageMediaViewer Team"]
edition = "2021"

[lib]
name = "image_media_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2.5"
rayon = "1.10"
exif = { package = "kamadak-exif", version = "0.6" }
imagesize = "0.13"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
fast_image_resize = "5"
webp = "0.3"
blake3 = "1.5"
chrono = { version = "0.4", features = ["serde"] }
notify = "7"
notify-debouncer-full = "0.4"
tokio = { version = "1", features = ["sync"] }
url = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
ts-rs = { version = "10", features = ["chrono-impl"] }
tiny_http = "0.12"

[dev-dependencies]
tempfile = "3"
