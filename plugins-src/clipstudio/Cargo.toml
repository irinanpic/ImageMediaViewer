[package]
name = "imv-plugin-clipstudio"
version = "1.0.0"
edition = "2021"
description = "ImageMediaViewer ClipStudio (.clip) format plugin"
authors = ["ImageMediaViewer Team"]

[lib]
name = "imv_clipstudio"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "clipstudio_plugin"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"
